document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

><\u002Fsvg>\n<\u002Fbutton>\n<sc-if value=\"{{ ownerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:0 14px 14px 60px;display:flex;flex-direction:column;gap:8px;font-size:15px;color:#C5C7DC\">\n<span>Owner since {{ ownerSince }}<\u002Fspan>\n<span style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:4px 10px;border-radius:999px;background:#33270F;color:#F5B544\">{{ ownerDue }}<\u002Fspan>\n<span style=\"font-size:14px;color:#9A9DBC\">Only one owner at a time.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ vBroker }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:16px;font-weight:600;line-height:1.25;background:{{ bBg }};border:{{ bBorder }};color:{{ bColor }};font-size:{{ bSize }}\">\n<span style=\"width:12px;height:12px;flex:none;border-radius:50%;background:currentColor;margin-top:7px\"><\u002Fspan><span>{{ bText }}<\u002Fspan>\n<\u002Fdiv>\n<sc-if value=\"{{ blocked }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:15px;font-weight:600;color:#C5C7DC\">What is missing<\u002Fspan><span style=\"font-size:21px;font-weight:500;line-height:1.3\">Lab certificate expires before the arrival date<\u002Fspan><\u002Fdiv>\n<div style=\"background:#1A1C35;border:1px solid #2B2E50;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:15px;font-weight:600;color:#C5C7DC\">Who must act, by when<\u002Fspan><span style=\"font-size:18px;line-height:1.3\">Exporter's lab – before ETA minus 12 h<\u002Fspan><\u002Fdiv>\n<button sc-camel-on-click=\"{{ goUpload }}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:12px;background:#5B34D1;color:#fff;font-size:18px;font-weight:600\"><svg width=\"20\" height=\"20\" sc-camel le=\"flex:1;width:2px;background:#2B2E50;margin-top:4px\"><\u002Fspan><\u002Fdiv>\n<div style=\"flex:1;min-width:0;padding-bottom:16px;display:flex;flex-direction:column;gap:5px\">\n<span style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px\">{{ m.t }}<\u002Fspan><span style=\"font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:{{ m.typeColor }}\">{{ m.type }}<\u002Fspan><\u002Fspan>\n<span style=\"font-size:16px;font-weight:500;line-height:1.35\">{{ m.title }}<\u002Fspan>\n<span style=\"font-size:13px;line-height:1.4;color:#C5C7DC\">{{ m.from }} → {{ m.to }}<\u002Fspan>\n<span style=\"font-size:13px;color:#9A9DBC\">Owner: {{ m.own }}<\u002Fspan>\n<span style=\"align-self:flex-start;font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px;background:{{ m.chipBg }};color:{{ m.chipFg }}\">{{ m.chip }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ vHelp }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><span style=\"font-size:24px;font-weight:600\">Help<\u002Fspan><span style=\"font-size:11px;font-weight:600;color:#C5C7DC;border:1px solid #424673;background:#23264A;border-radius:999px;padding:3px 9px\">SAMPLE content<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ faq }}\" as=\"q\" hint-placeholder-count=\"5\">\n<div style=\"background:#1A1C35;border:1px solid #2B2E50;border-radius:14px;overflow:hidden\">\n<button sc-camel-on-click=\"{{ q.toggle }}\" style=\"width:100%;min-height:56px;padding:12px 14px;display:flex;align-items:center;gap:10px\"><span style=\"flex:1;font-size:16px;font-weight:600;line-height:1.35\">{{ q.q }}<\u002Fspan><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9A9DBC\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;transform:{{ q.rot }}\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<sc-if value=\"{{ q.open }}\"><div style=\"padding:0 14px 14px;font-size:16px;line-height:1.5;color:#C5C7DC\">{{ q.a }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ tourOn }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex:none;margin:0 10px 8px;background:#1A1C35;border:1.5px solid #E8429F;border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 30px rgba(0,0,0,.45)\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><span style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#E8429F\">{{ tourLabel }} · {{ tourRole }}<\u002Fspan><button sc-camel-on-click=\"{{ endTour }}\" style=\"min-height:36px;padding:0 4px;font-size:14px;color:#9A9DBC\">End tour<\u002Fbutton><\u002Fdiv>\n<span style=\"font-size:16px;line-height:1.45\">{{ tourCap }}<\u002Fspan>\n<button sc-camel-on-click=\"{{ tourNext }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;background:#5B34D1;color:#fff;font-size:17px;font-weight:600\">{{ tourBtn }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#13152A;border-top:1px solid #2B2E50;padding-bottom:env(safe-area-inset-bottom)\">\n<button sc-camel-on-click=\"{{ tabMain }}\" style=\"min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:{{ cMain }};box-shadow:{{ sMain }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01\"><\u002Fpath><\u002Fsvg>{{ mainLabel }}<\u002Fbutton>\n<button sc-camel-on-click=\"{{ tabRules }}\" style=\"min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:{{ cRules }};box-shadow:{{ sRules }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z\"><\u002Fpath><path d=\"M5 17a3 3 0 0 1 3-3h11\"><\u002Fpath><\u002Fsvg>Rules<\u002Fbutton>\n<button sc-camel-on-click=\"{{ tabMsgs }}\" style=\"min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:{{ cMsgs }};box-shadow:{{ sMsgs }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H9l-5 4z\"><\u002Fpath><\u002Fsvg>Messages<\u002Fbutton>\n<button sc-camel-on-click=\"{{ tabHelp }}\" style=\"min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:{{ cHelp }};box-shadow:{{ sHelp }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>Help<\u002Fbutton>\n<\u002Fdiv>\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;left:16px;right:16px;top:118px;z-index:40;display:flex;justify-content:center;pointer-events:none\"><span style=\"background:#F4F4FA;color:#0F1020;font-size:15px;font-weight:500;line-height:1.35;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center\">{{ toast }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end\">\n<div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position:absolute;inset:0;background:rgba(5,6,14,.74)\"><\u002Fdiv>\n<div style=\"position:relative;max-height:88%;overflow-y:auto;background:#13152A;border-top:1px solid #424673;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;justify-content:center;padding:2px 0 4px\"><span style=\"width:44px;height:5px;border-radius:3px;background:#424673\"><\u002Fspan><\u002Fdiv>\n\n<sc-if value=\"{{ sheetRoles }}\">\n<span style=\"font-size:22px;font-weight:600\">Demo: view as…<\u002Fspan>\n<span style=\"font-size:14px;color:#9A9DBC\">Prototype control – not part of the product.<\u002Fspan>\n<sc-for list=\"{{ roles }}\" as=\"ro\" hint-placeholder-count=\"4\">\n<button sc-camel-on-click=\"{{ ro.onPick }}\" style=\"width:100%;min-height:64px;padding:12px 14px;border-radius:14px;display:flex;align-items:center;gap:12px;background:{{ ro.bg }};border:{{ ro.border }}\">\n<span style=\"flex:1;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:17px;font-weight:600\">{{ ro.label }}<\u002Fspan><span style=\"font-size:14px;color:#9A9DBC\">{{ ro.sub }}<\u002Fspan><\u002Fspan>\n<sc-if value=\"{{ ro.active }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#BBA6FF\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"5 12.5 10 17 19 7\"><\u002Fpolyline><\u002Fsvg><\u002Fsc-if>\n<\u002Fbutton>\n<\u002Fsc-for>\n<button sc-camel-on-click=\"{{ resetDemo }}\" style=\"align-self:center;min-height:44px;font-size:15px;color:#BBA6FF;text-decoration:underline;text-underline-offset:3px\">Reset demo<\u002Fbutton>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ sheetDoc }}\">\n<div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:21px;font-weight:600\">{{ sd.name }}<\u002Fspan><span style=\"font-size:14px;color:#9A9DBC\">Issued by {{ sd.issuer }}<\u002Fspan><\u002Fdiv>\n<div style=\"height:170px;border:1px solid #2B2E50;border-radius:14px;background:repeating-linear-gradient(45deg,#1A1C35 0 10px,#20223F 10px 20px);display:flex;align-items:center;justify-content:center\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;color:#C5C7DC;background:#0F1020;padding:6px 10px;border-radius:6px\">SAMPLE document preview<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n<div style=\"background:#1A1C35;border:1px solid #2B2E50;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:13px;color:#9A9DBC\">Type<\u002Fspan><span style=\"font-size:15px\">{{ sd.name }}<\u002Fspan><\u002Fdiv>\n<div style=\"background:#1A1C35;border:1px solid #2B2E50;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:13px;color:#9A9DBC\">Issuer<\u002Fspan><span style=\"font-size:15px\">{{ sd.issuer }}<\u002Fspan><\u002Fdiv>\n<div style=\"background:#1A1C35;border:1px solid #2B2E50;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:13px;color:#9A9DBC\">Issue date<\u002Fspan><span style=\"font-size:15px\">{{ sd.issued }}<\u002Fspan><\u002Fdiv>\n<div style=\"background:#1A1C35;border:1px solid #2B2E50;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:13px;color:#9A9DBC\">Expiry date<\u002Fspan><span style=\"font-size:15px\">{{ sd.exp }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#1A1C35;border:1px solid #2B2E50;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;color:#9A9DBC\">Checked by {{ sd.src }} (outcome only)<\u002Fspan><span style=\"font-size:16px;line-height:1.45;color:{{ sd.resultColor }}\">{{ sd.result }}<\u002Fspan><\u002Fdiv>\n<sc-if value=\"{{ docCustoms }}\">\n<button sc-camel-on-click=\"{{ approveDoc }}\" style=\"display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;background:#5B34D1;color:#fff;font-size:18px;font-weight:600\">Approve<\u002Fbutton>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n<button sc-camel-on-click=\"{{ demoOnly }}\" style=\"min-height:48px;border-radius:12px;border:1.5px solid #424673;color:#BBA6FF;font-size:15px;font-weight:500;text-align:center\">Query broker<\u002Fbutton>\n<button sc-camel-on-click=\"{{ demoOnly }}\" style=\"min-height:48px;border-radius:12px;border:1.5px solid #424673;color:#BBA6FF;font-size:15px;font-weight:500;text-align:center\">Return with reason<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ docUpload }}\"><button sc-camel-on-click=\"{{ goUpload }}\" style=\"display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;background:#5B34D1;color:#fff;font-size:18px;font-weight:600\">Upload new certificate<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ docClose }}\"><button sc-camel-on-click=\"{{ closeSheet }}\" style=\"min-height:50px;border-radius:12px;border:1.5px solid #424673;color:#BBA6FF;font-size:16px;font-weight:500;text-align:center\">Close<\u002Fbutton><\u002Fsc-if>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ sheetRule }}\">\n<div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:16px;font-weight:500;color:#BBA6FF;background:#23264A;border-radius:8px;padding:3px 10px\">{{ sr.id }}<\u002Fspan><span style=\"font-size:17px;font-weight:600;color:#C5C7DC\">{{ sr.title }}<\u002Fspan><span style=\"font-size:11px;font-weight:600;color:#C5C7DC;border:1px dashed #424673;border-radius:999px;padding:2px 8px\">SAMPLE rule<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:20px;line-height:1.45\">{{ sr.text }}<\u002Fspan>\n<span style=\"font-size:14px;color:#9A9DBC\">Agreed by<\u002Fspan>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\"><sc-for list=\"{{ sr.ag }}\" as=\"a\" hint-placeholder-count=\"2\"><span style=\"font-size:14px;color:#C5C7DC;border:1px solid #2B2E50;border-radius:999px;padding:5px 12px\">✓ {{ a }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<span style=\"font-size:14px;color:#9A9DBC\">A rule changes only when every agency listed agrees.<\u002Fspan>\n<button sc-camel-on-click=\"{{ closeSheet }}\" style=\"min-height:50px;border-radius:12px;border:1.5px solid #424673;color:#BBA6FF;font-size:16px;font-weight:500;text-align:center\">Close<\u002Fbutton>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY='waseet-mobile-demo-v1';\nconst INIT={role:'broker',tab:'main',view:'ship',ref:'SHP-1001',refType:'bl',linkErr:'',linked:false,checked:false,certFixed:false,laneConfirmed:false,handedOff:false,accepted:false,released:false,approved:{},ownerOpen:false,contactOpen:false,helpOpen:0,ruleQ:'',tour:null};\nconst TONE={g:['#0F2C1D','#5BD38A'],a:['#33270F','#F5B544'],r:['#3A1520','#FF7A70'],n:['#23264A','#C5C7DC']};\nconst TYPE={req:['Request','#BBA6FF'],out:['Outcome','#5BD38A'],doc:['Document','#C5C7DC'],hand:['Handoff','#E8429F']};\nconst ROLES=[{id:'broker',label:'Broker',sub:'Al Noor Clearing LLC · acts for the importer'},{id:'customs',label:'Customs Officer',sub:'Reviews documents, confirms the lane'},{id:'food',label:'Food Safety',sub:'Accepts handoffs for food imports'},{id:'port',label:'Port Operator',sub:'Handles cargo once released'}];\nconst AG={broker:'Broker',customs:'Customs',food:'Food Safety',port:'Port Operator'};\nconst MAIN={broker:'Shipments',customs:'Queue',food:'Handoffs',port:'Releases'};\nconst RULES=[\n{id:'R-01',title:'Shared acceptance',text:'A document verified once by one agency is accepted by every agency listed here, with no re-check.',ag:['Customs','Food Safety','Health','Standards']},\n{id:'R-02',title:'Health certificates for food',text:\"Customs accepts Food Safety's outcome on a health certificate for food imports and does not check it again.\",ag:['Customs','Food Safety']},\n{id:'R-03',title:'Lab certificates',text:'Food Safety accepts a lab certificate if it was issued by an approved lab, is under 90 days old and is valid at arrival.',ag:['Food Safety','Customs']},\n{id:'R-04',title:'Dairy conformity',text:\"Standards accepts Food Safety's acceptance of a dairy shipment in place of its own conformity check.\",ag:['Standards','Food Safety']},\n{id:'R-05',title:'Handoff deadline',text:\"Each handoff is accepted or returned within 4 working hours. If not, it goes to the sending agency's duty supervisor.\",ag:['Customs','Food Safety','Health','Standards','Port Operator']},\n{id:'R-06',title:'Release at the gate',text:'The Port Operator releases cargo once Customs has confirmed a lane and every other agency involved has accepted its handoff.',ag:['Port Operator','Customs','Food Safety']},\n{id:'R-07',title:'Origin for medical imports',text:\"Health accepts Customs' verification of the certificate of origin for medical imports.\",ag:['Health','Customs']}];\nconst FAQ=[\n{q:'Does WASEET decide if my cargo is cleared?',a:'No. Each agency checks documents with its own rules and systems. WASEET only carries the request, the outcome and the handoff. An officer makes every decision.'},\n{q:'Why was my shipment blocked?',a:\"One document did not meet an agency's rule. The red line says which document, who must fix it and by when.\"},\n{q:'Will another agency ask for the same document again?',a:'No. Under agreed rule R-01, a document verified once is accepted by every agency that agreed to the rule.'},\n{q:'What does \"ETA minus 12 h\" mean?',a:\"The fix must arrive at least 12 hours before the ship's estimated time of arrival.\"},\n{q:'Who can see the risk reasoning?',a:'Only the agency that owns it. Other agencies see the outcome only.'}];\nconst TOUR=[\n{n:1,cap:'The broker enters shipment reference SHP-1001 and taps Link.',go:{}},\n{n:1,cap:\"WASEET asks each agency's own system. Customs and Food Safety reply with outcomes. One item blocks pre-arrival clearance.\",go:{linked:true}},\n{n:2,cap:'The broker uploads a new lab certificate. The fields are pre-filled; the broker checks them and confirms.',go:{view:'upload',checked:true}},\n{n:2,cap:\"Re-checked against Food Safety's rules. Status turns green and the message trail records it.\",go:{view:'ship',certFixed:true}},\n{n:3,cap:'Now viewing as Customs. The officer reviews the documents. The lane is a suggestion; the officer decides.',go:{role:'customs'}},\n{n:3,cap:'The officer confirms the lane. Next, Customs hands the shipment to Food Safety.',go:{laneConfirmed:true}},\n{n:3,cap:'Handoff sent. Customs stays the owner until Food Safety accepts.',go:{handedOff:true}},\n{n:4,cap:'Now viewing as Food Safety. The documents were verified once under rule R-01, so no re-check is needed.',go:{role:'food'}},\n{n:4,cap:'Food Safety accepts the handoff. Ownership is transferred to Food Safety.',go:{accepted:true}},\n{n:5,cap:'Now viewing as Port Operator. The shipment is released for handling.',go:{role:'port',released:true}},\n{n:6,cap:'The message trail shows every step: who sent it, who received it, who owns it and when.',go:{tab:'messages'}}];\n\nclass Component extends DCLogic {\n  state = {...INIT, sheet:null, toast:''};\n  scroller = React.createRef();\n  componentDidMount(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)this.setState({...INIT,...s});}catch(e){}}\n  componentDidUpdate(){\n    const s=this.state,save={};Object.keys(INIT).forEach(k=>save[k]=s[k]);\n    try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}\n    const k=[s.role,s.tab,s.view,s.tour].join('|');\n    if(this._k!==k){this._k=k;const el=this.scroller.current;if(el)el.scrollTop=0;}\n  }\n  componentWillUnmount(){clearTimeout(this.tt);}\n  say(t){clearTimeout(this.tt);this.setState({toast:t});this.tt=setTimeout(()=>this.setState({toast:''}),2600);}\n  setRole(r){const s=this.state,u={role:r,tab:'main',view:'ship',sheet:null};if(r==='port'&&s.accepted&&!s.released)u.released=true;this.setState(u);}\n  goStep(i){const st={...INIT,approved:{}};for(let j=0;j<=i;j++)Object.assign(st,{tab:'main'},TOUR[j].go);this.setState({...st,tour:i,sheet:null});}\n  owner(){const s=this.state;if(!s.linked)return null;\n    if(!s.certFixed)return {ag:'Broker',name:'R. Haddad',since:'10 Nov, 08:15',due:'Fix due 11 Nov, 18:00',resp:'Usually replies within 1 h',idx:0};\n    if(!s.accepted)return {ag:'Customs',name:'S. Karimi',since:'10 Nov, 10:12',due:s.handedOff?'Owner until Food Safety accepts':'Lane decision due 11 Nov, 18:00',resp:'Usually replies within 2 h',idx:1};\n    if(!s.released)return {ag:'Food Safety',name:'Dr. L. Mansour',since:'10 Nov, 12:05',due:'Inspection decision due 11 Nov, 22:00',resp:'Usually replies within 2 h',idx:2};\n    return {ag:'Port Operator',name:'K. Nasser',since:'10 Nov, 12:20',due:'Gate handling on arrival, 12 Nov 06:00',resp:'Usually replies within 30 min',idx:3};}\n  docs(){const f=this.state.certFixed;const V=\"Verified once – won't be asked again\";return [\n    {id:'inv',name:'Commercial invoice',agency:'Customs',by:'Customs',exp:'—',src:'Customs rules system',k:'g',chip:'Already verified',note:V,issuer:'Al Noor Clearing LLC',issued:'05 Nov 2026',result:'Passes. Declared value matches the invoice total.'},\n    {id:'coo',name:'Certificate of origin',agency:'Customs',by:'Customs',exp:'—',src:'Customs rules system',k:'g',chip:'Already verified',note:V,issuer:'Sample Chamber of Commerce',issued:'04 Nov 2026',result:'Passes. Origin matches the declaration.'},\n    {id:'hc',name:'Health certificate',agency:'Food Safety',by:'Food Safety',exp:'30 Nov 2026',src:'Food Safety rules system',k:'g',chip:'Already verified',note:V,issuer:'Sample Country A Food Authority',issued:'03 Nov 2026',result:'Passes. Valid on the arrival date.'},\n    {id:'lab',name:'Lab certificate',agency:'Food Safety',by:f?'Food Safety':'not accepted',exp:f?'08 Feb 2027':'10 Nov 2026',src:'Food Safety rules system',k:f?'g':'r',chip:f?'Verified – replaced':'Expires before arrival',note:f?'New certificate · valid to 08 Feb 2027':'Expires 10 Nov, before arrival on 12 Nov',issuer:'Harbourline Testing Lab',issued:f?'08 Nov 2026':'12 Aug 2026',result:f?'Passes. Valid until 08 Feb 2027, after arrival on 12 Nov 2026.':'Does not pass. Expires 10 Nov 2026, before arrival on 12 Nov 2026.'}];}\n  msgs(){const s=this.state,m=[];if(!s.linked)return m;\n    m.push(['08:15','req','Request: documents check → Customs','Al Noor Clearing LLC (broker)','Customs','Customs','g','Answered']);\n    m.push(['08:15','req','Request: documents check → Food Safety','Al Noor Clearing LLC (broker)','Food Safety','Food Safety','g','Answered']);\n    m.push(['08:44','out','Outcome: 3 documents accepted','Customs','Broker, Food Safety','Customs','g','Closed']);\n    m.push(['08:46','out','Outcome: 1 document expired','Food Safety','Broker, Customs',\"Exporter's lab · due before ETA −12 h\",s.certFixed?'g':'r',s.certFixed?'Resolved 10:05':'Action needed']);\n    if(s.certFixed){m.push(['10:05','doc','Document re-submitted: lab certificate','Al Noor Clearing LLC (broker)','Food Safety','Food Safety','g','Delivered']);m.push(['10:12','out','Outcome: accepted under R-01','Food Safety','Customs, Broker','Customs','g','Closed']);}\n    if(s.laneConfirmed)m.push(['11:30','out','Outcome: lane confirmed – Fast lane','Customs (S. Karimi)','Broker, Food Safety','Customs','g','Closed']);\n    if(s.handedOff)m.push(['11:32','hand','Handoff sent: Customs → Food Safety','Customs','Food Safety','Customs until accepted',s.accepted?'g':'a',s.accepted?'Accepted 12:05':'Waiting']);\n    if(s.accepted)m.push(['12:05','hand','Handoff accepted by Food Safety','Food Safety (Dr. L. Mansour)','Customs, Broker, Port Operator','Food Safety','g','Accepted']);\n    if(s.released)m.push(['12:20','out','Outcome: released for handling (R-06)','Port Operator','Broker, Customs, Food Safety','Port Operator','g','Released']);\n    return m.map(([t,ty,title,from,to,own,k,chip])=>({t,type:TYPE[ty][0],typeColor:TYPE[ty][1],title,from,to,own,chip,chipBg:TONE[k][0],chipFg:TONE[k][1]}));}\n  renderVals(){\n    const s=this.state,r=s.role,set=u=>this.setState(u);\n    const o=this.owner(),you=!!o&&o.ag===AG[r];\n    const tone=d=>({...d,chipBg:TONE[d.k][0],chipFg:TONE[d.k][1]});\n    const openDoc=id=>()=>set({sheet:{t:'doc',id}}),openRule=id=>()=>set({sheet:{t:'rule',id}});\n    const docs=this.docs().map(d=>({...d,onOpen:openDoc(d.id)}));\n    const msgs=this.msgs();\n    const main=s.tab==='main',blocked=s.linked&&!s.certFixed;\n    const vUpload=main&&r==='broker'&&s.linked&&s.view==='upload';\n    const shell=main&&s.linked&&!vUpload;\n    const idx=o?o.idx:-1;\n    const strip=['Broker','Customs','Food Safety','Port'].map((l,i)=>{const done=i<idx,cur=i===idx;return {label:l,done,bg:cur?'#5B34D1':done?'#23264A':'#1A1C35',border:cur?'0':done?'1px solid #424673':'2px dashed #424673',shadow:cur?'0 0 0 3px #13152A, 0 0 0 5px #E8429F':'none',color:cur?'#F4F4FA':'#9A9DBC',weight:cur?600:400};});\n    let bt='r',bText='1 item blocking pre-arrival clearance';\n    if(s.certFixed){bt='g';bText=s.released?'Released for handling':s.accepted?'Ownership transferred to Food Safety':s.handedOff?'All documents accepted – waiting for Food Safety to accept handoff':'All documents accepted – waiting for Customs to confirm the lane';}\n    const countdown=!s.linked?'46h 10m':!s.certFixed?'45h 00m':!s.laneConfirmed?'44h 00m':!s.accepted?'43h 30m':!s.released?'42h 50m':'42h 30m';\n    const reviews=[\n      {ag:'Customs',who:'Owner: S. Karimi',lead:true,...(!s.certFixed?{k:'a',chip:'Waiting for broker'}:!s.laneConfirmed?{k:'a',chip:'In review'}:{k:'g',chip:'Lane confirmed'})},\n      {ag:'Food Safety',who:'Owner: Dr. L. Mansour',lead:false,...(!s.handedOff?{k:'n',chip:'Waiting'}:!s.accepted?{k:'a',chip:'To accept'}:{k:'g',chip:'Accepted'})},\n      {ag:'Standards',who:'No owner · rule R-04',lead:false,k:'n',chip:'Not required'}].map(tone);\n    const q=s.ruleQ.trim().toLowerCase();\n    const rules=RULES.filter(x=>!q||(x.id+' '+x.title+' '+x.text).toLowerCase().includes(q)).map(x=>({...x,onOpen:openRule(x.id)}));\n    const sh=s.sheet;const sd=sh&&sh.t==='doc'?docs.find(d=>d.id===sh.id):null;const sr=sh&&sh.t==='rule'?RULES.find(x=>x.id===sh.id):null;\n    const tab=(t)=>({c:s.tab===t?'#BBA6FF':'#9A9DBC',s:s.tab===t?'inset 0 2px 0 #BBA6FF':'none',fn:()=>set({tab:t,sheet:null})});\n    const T1=tab('main'),T2=tab('rules'),T3=tab('messages'),T4=tab('help');\n    const ts=s.tour!==null?TOUR[s.tour]:null,last=s.tour===TOUR.length-1;\n    return {\n      roleLabel:ROLES.find(x=>x.id===r).label, openRoles:()=>set({sheet:{t:'roles'}}), closeSheet:()=>set({sheet:null}),\n      resetDemo:()=>{try{localStorage.removeItem(KEY);}catch(e){}this.setState({...INIT,approved:{},sheet:null});this.say('Demo reset. Ready for the next judge.');},\n      showStrip:shell, strip, scroller:this.scroller,\n      vLink:main&&r==='broker'&&!s.linked, vEmpty:main&&r!=='broker'&&!s.linked, vUpload, shell,\n      vBroker:shell&&r==='broker', vCustoms:shell&&r==='customs', vFood:shell&&r==='food', vPort:shell&&r==='port',\n      vRules:s.tab==='rules', vMsgs:s.tab==='messages', vHelp:s.tab==='help',\n      startTour:()=>this.goStep(0),\n      setBL:()=>set({refType:'bl'}), setAWB:()=>set({refType:'awb'}),\n      blBg:s.refType==='bl'?'#23264A':'transparent', blColor:s.refType==='bl'?'#F4F4FA':'#C5C7DC', blWeight:s.refType==='bl'?600:400,\n      awbBg:s.refType==='awb'?'#23264A':'transparent', awbColor:s.refType==='awb'?'#F4F4FA':'#C5C7DC', awbWeight:s.refType==='awb'?600:400,\n      refValue:s.ref, onRef:e=>set({ref:e.target.value,linkErr:''}), hasLinkErr:!!s.linkErr, linkErr:s.linkErr,\n      doLink:()=>{if(s.ref.trim().toUpperCase()==='SHP-1001')set({linked:true,linkErr:'',ref:'SHP-1001'});else set({linkErr:'Demo data only includes SHP-1001.'});},\n      backShip:()=>set({view:'ship'}), goUpload:()=>set({role:'broker',tab:'main',view:'upload',sheet:null}),\n      uploadFields:[{label:'Type',value:'Laboratory analysis certificate'},{label:'Issuer',value:'Harbourline Testing Lab'},{label:'Issue date',value:'08 Nov 2026'},{label:'Expiry date',value:'08 Feb 2027'}],\n      checked:s.checked, checkBg:s.checked?'#5B34D1':'transparent', toggleCheck:()=>set({checked:!s.checked}), confirmOpacity:s.checked?1:.5,\n      confirmFix:()=>{if(!s.checked)return this.say('Tick the box first to confirm the fields.');set({certFixed:true,view:'ship'});this.say('Re-checked – all documents accepted. Logged.');},\n      countdown, ownerLine:o?`${o.ag} · ${o.name}${you?' (you)':''}`:'', ownerAg:o?o.ag:'', ownerSince:o?o.since:'', ownerDue:o?o.due:'', ownerResp:o?o.resp:'',\n      ownerOpen:s.ownerOpen, ownerRot:s.ownerOpen?'rotate(180deg)':'none', toggleOwner:()=>set({ownerOpen:!s.ownerOpen}),\n      contactOpen:s.contactOpen, contactRot:s.contactOpen?'rotate(180deg)':'none', toggleContact:()=>set({contactOpen:!s.contactOpen}),\n      msgOpacity:you?.5:1, messageOwner:()=>this.say(you?'You are the current owner.':`Message sent to ${o.ag} – logged.`), isBroker:r==='broker',\n      bBg:TONE[bt][0], bColor:TONE[bt][1], bBorder:bt==='r'?'2px solid #E5484D':'1px solid #2F8F56', bSize:bt==='r'?'21px':'18px', bText,\n      blocked, notBlocked:s.linked&&s.certFixed,\n      agencies:[{name:'Customs',docs:docs.filter(d=>d.agency==='Customs').map(tone)},{name:'Food Safety',docs:docs.filter(d=>d.agency==='Food Safety').map(tone)}],\n      demoOnly:()=>this.say('Demo only – not wired in this prototype.'),\n      reviews, customsDocs:docs.map(d=>s.approved[d.id]?{...d,k:'g',chip:'Approved by you'}:d).map(tone),\n      laneOpen:!s.laneConfirmed, laneOpacity:s.certFixed?1:.5, laneDone:s.laneConfirmed, canHandOff:s.laneConfirmed&&!s.handedOff, handed:s.handedOff,\n      handedText:s.accepted?'Food Safety accepted the handoff at 12:05.':'Handed off to Food Safety at 11:32 – waiting for acceptance.',\n      confirmLane:()=>{if(!s.certFixed)return this.say('Available once all documents pass.');set({laneConfirmed:true});this.say('Lane confirmed – logged.');},\n      handOff:()=>{set({handedOff:true});this.say('Handoff sent to Food Safety – logged.');},\n      foodWait:!s.handedOff, foodDecide:s.handedOff&&!s.accepted, foodDone:s.accepted,\n      accept:()=>{set({accepted:true});this.say('Handoff accepted – logged.');},\n      foodDocs:docs.map(d=>({...d,ok:d.k==='g',bad:d.k!=='g'})),\n      openR01:openRule('R-01'), openR03:openRule('R-03'), openR06:openRule('R-06'),\n      portWait:!s.released, portDone:s.released, portLane:s.laneConfirmed?'Fast lane (confirmed by Customs)':'Not confirmed yet',\n      ruleQ:s.ruleQ, onRuleQ:e=>set({ruleQ:e.target.value}), rules, noRules:rules.length===0,\n      msgs, noMsgs:msgs.length===0, msgCount:`${msgs.length} message${msgs.length===1?'':'s'}`,\n      faq:FAQ.map((f,i)=>({...f,open:s.helpOpen===i,rot:s.helpOpen===i?'rotate(180deg)':'none',toggle:()=>set({helpOpen:s.helpOpen===i?-1:i})})),\n      tourOn:!!ts, tourLabel:ts?`Step ${ts.n} of 6`:'', tourRole:ROLES.find(x=>x.id===r).label, tourCap:ts?ts.cap:'', tourBtn:last?'Finish tour':'Next',\n      tourNext:()=>{if(last){set({tour:null});this.say('Tour complete. Tap Reset demo for the next judge.');}else this.goStep(s.tour+1);},\n      endTour:()=>set({tour:null}),\n      mainLabel:MAIN[r], tabMain:T1.fn, tabRules:T2.fn, tabMsgs:T3.fn, tabHelp:T4.fn,\n      cMain:T1.c, sMain:T1.s, cRules:T2.c, sRules:T2.s, cMsgs:T3.c, sMsgs:T3.s, cHelp:T4.c, sHelp:T4.s,\n      hasToast:!!s.toast, toast:s.toast,\n      sheetOpen:!!sh, sheetRoles:!!sh&&sh.t==='roles', sheetDoc:!!sd, sheetRule:!!sr,\n      roles:ROLES.map(x=>({...x,active:x.id===r,bg:x.id===r?'#231B4E':'#1A1C35',border:x.id===r?'1.5px solid #5B34D1':'1px solid #2B2E50',onPick:()=>this.setRole(x.id)})),\n      sd:sd?{...sd,resultColor:sd.k==='g'?'#5BD38A':'#FF7A70'}:{}, sr:sr||{ag:[]},\n      docCustoms:!!sd&&r==='customs', docUpload:!!sd&&r==='broker'&&sd.id==='lab'&&!s.certFixed, docClose:!!sd&&r!=='customs'&&!(r==='broker'&&sd.id==='lab'&&!s.certFixed),\n      approveDoc:()=>{set({approved:{...s.approved,[sd.id]:true},sheet:null});this.say('Approved – logged.');}\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
